repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: sh -c 'for file; do gitleaks dir --redact --no-banner -- "$file" || exit 1; done' gitleaks
      - id: gitleaks-cases
        name: staged gitleaks cases
        language: system
        entry: sh tests/gitleaks.sh
        files: ^(.pre-commit-config.yaml|tests/gitleaks\.sh)$
        pass_filenames: false
      - id: hadolint
        name: hadolint
        language: system
        entry: hadolint
        files: ^Dockerfile$
      - id: jackin-pins
        name: jackin-pins
        language: system
        entry: scripts/check-jackin-pins.sh
        pass_filenames: false
        always_run: true
