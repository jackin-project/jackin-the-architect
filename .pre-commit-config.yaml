repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks dir --redact --no-banner .
        pass_filenames: false
        always_run: true
      - id: hadolint
        name: hadolint
        language: system
        entry: hadolint
        files: ^Dockerfile$
      - id: jackin-pins
        name: jackin-pins
        language: system
        entry: scripts/check-jackin-pins.sh
        pass_filenames: false
        always_run: true
