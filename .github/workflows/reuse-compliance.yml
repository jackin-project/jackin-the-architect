name: reuse-compliance
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: github (default) | velnor | both
        type: choice
        default: github
        options: [github, velnor, both]
permissions:
  contents: read
concurrency:
  group: reuse-compliance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reuse:
    name: REUSE (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true},{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'velnor') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]' || '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          # Host /opt/mise installs are shared across daemons and can ship
          # non-executable pipx shims (Permission denied). Keep tools job-local.
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-config
        with:
          version: "2026.8.6"
          install_args: python uv pipx:reuse
          cache_save: ${{ github.ref == 'refs/heads/main' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: REUSE Compliance Check
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-config
        run: reuse lint
