name: Jackin Toolchain

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
      - name: Update Jackin toolchain
        run: mise exec cargo:rust-script@0.36.0 -- scripts/update-jackin-toolchain.rs
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: renovate/jackin-toolchain
          delete-branch: true
          title: "build: update jackin toolchain"
          commit-message: "build: update jackin toolchain"
          signoff: true
          body: |
            Updates `jackin-toolchain/mise.toml` from upstream `jackin-project/jackin` `mise.toml`.
