name: Jackin Toolchain

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: Runner lane. Defaults to GitHub.
        type: choice
        default: github
        options: [github, velnor]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.lane == 'velnor') && fromJSON('["self-hosted","velnor-target-mvp"]') || 'ubuntu-26.04' }}
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          # Host /opt/mise installs are shared across daemons and can ship
          # non-executable pipx shims (Permission denied). Keep tools job-local.
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-config
        with:
          install: false
      - name: Update Jackin toolchain
        run: mise exec cargo:rust-script@0.36.0 -- scripts/update-jackin-toolchain.rs
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ env.RENOVATE_TOKEN }}
          branch: renovate/jackin-toolchain
          delete-branch: true
          title: "build: update jackin toolchain"
          commit-message: "build: update jackin toolchain"
          signoff: true
          body: |
            Updates `jackin-toolchain/mise.toml` from upstream `jackin-project/jackin` `mise.toml`.
