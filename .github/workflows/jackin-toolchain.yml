name: Jackin Toolchain

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jackin-toolchain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update Jackin toolchain (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'github') && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 20
    env:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        env:
          # Host /opt/mise installs are shared across daemons and can ship
          # non-executable pipx shims (Permission denied). Keep tools job-local.
          MISE_DATA_DIR: ${{ runner.temp }}/mise-data
          MISE_CACHE_DIR: ${{ runner.temp }}/mise-cache
          MISE_CONFIG_DIR: ${{ runner.temp }}/mise-config
        with:
          install: false
      - name: Update Jackin toolchain
        run: mise exec cargo:rust-script@0.36.0 -- scripts/update-jackin-toolchain.rs
      - name: Create pull request
        if: matrix.config.writer
        env:
          GH_TOKEN: ${{ env.RENOVATE_TOKEN }}
          # peter-evans/create-pull-request is not in the Velnor strict
          # capability manifest, so jobs using it are rejected at admission
          # (capability_validation). Use the gh CLI in a run step instead.
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No toolchain changes; skipping pull request."
            exit 0
          fi
          git config user.name "Renovate Bot"
          git config user.email "renovate@whitesourcesoftware.com"
          git checkout -B renovate/jackin-toolchain
          git add jackin-toolchain/mise.toml
          git commit -s -m "build: update jackin toolchain"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" renovate/jackin-toolchain
          gh pr create \
            --title "build: update jackin toolchain" \
            --body "Updates \`jackin-toolchain/mise.toml\` from upstream \`jackin-project/jackin\` \`mise.toml\`." \
            --head renovate/jackin-toolchain \
          || gh pr view renovate/jackin-toolchain
      - name: Verify comparison lane remains read-only
        if: ${{ !matrix.config.writer }}
        run: git diff --exit-code
