name: Jackin Toolchain

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: false
      - name: Update Jackin toolchain
        run: mise exec cargo:rust-script@0.36.0 -- scripts/update-jackin-toolchain.rs
      - name: Create pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: renovate/jackin-toolchain
          delete-branch: true
          title: "build: update jackin toolchain"
          commit-message: "build: update jackin toolchain"
          signoff: true
          body: |
            Updates `jackin-toolchain/mise.toml` from upstream `jackin-project/jackin` `mise.toml`.
