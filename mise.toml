[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
prek = "0.5.0"
python = "3.14.7"
uv = "0.12.10"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python"] }

[settings]
lockfile = true

[tasks.ci]
description = "Run the repository CI gate"
run = "prek run --all-files"

[tasks.test]
description = "Run the repository test gate"
run = "prek run --all-files"

[tasks.lint]
description = "Run the repository lint gate"
run = "prek run --all-files"

[tasks.fmt]
description = "Run the repository formatting gate"
run = "prek run --all-files"
