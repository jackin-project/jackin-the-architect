[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
prek = "0.4.14"
python = "3.14.7"
uv = "0.12.6"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer", depends = ["python"] }

[settings]
lockfile = true

# Gate task contract: `test` is the single real gate (one `prek run
# --all-files` execution per commit). `ci`, `lint`, and `fmt` are pure
# depends-aliases of `test` with no command of their own, so every gate name
# the canonical CI workflow calls (`mise run ci/test/lint/fmt`) resolves to
# exactly one prek execution and no task carries a duplicated command.
[tasks.test]
description = "Run the repository test gate (single prek execution)"
run = "prek run --all-files"

[tasks.ci]
description = "Human aggregate gate: alias of test"
depends = ["test"]

[tasks.lint]
description = "Alias of test: prek is the single lint gate"
depends = ["test"]

[tasks.fmt]
description = "Alias of test: prek is the single format gate"
depends = ["test"]
