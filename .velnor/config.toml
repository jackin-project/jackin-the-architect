schema = 2

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
generator_validation = "bootstrap"
max_parallel_jobs = 2
pull_request_cache_policy = "read-only"
runner_label = "ubuntu-26.04"

[[workflow.tasks]]
kind = "verification"
id = "jackin-pins"
mise_task = "check:jackin-pins"
runner = "linux-x64"
timeout_minutes = 5

[workflow.tasks.source]
mise_config = "mise.toml"
working_directory = "."

[[workflow.tasks]]
kind = "verification"
id = "test"
mise_task = "test"
runner = "linux-x64"
timeout_minutes = 10

[workflow.tasks.source]
mise_config = "mise.toml"
working_directory = "."

[resources]
compiler_process_budget = 2
test_process_budget = 2

[test_sharding]
default_shards = 1

[test_sharding.by_manifest]

[stacks]
ignore = []

[discovery]
exclude = []

[actions.overrides]

[execution]
default_profile = "local"
hosted_profile = "hosted"
scale_set_profile = "local"

[execution.profiles.hosted]
kind = "github-hosted"
label = "ubuntu-26.04"
platform = "linux/amd64"

[execution.profiles.local]
kind = "github-scale-set"
name = "ubuntu-26.04-scale-set"
labels = ["velnor", "ubuntu-26.04-scale-set"]
platform = "linux/amd64"
