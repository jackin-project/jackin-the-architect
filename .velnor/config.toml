schema = 1

[workflow]
name = "CI"
policy = "consumer-v1"
default_branch = "main"
runner_label = "ubuntu-26.04"
generator_validation = "bootstrap"
max_parallel_jobs = 2

[[workflow.tasks]]
id = "test"
kind = "verification"
mise_task = "test"
source = { mise_config = "mise.toml", working_directory = "." }
runner = "linux-x64"
timeout_minutes = 10
