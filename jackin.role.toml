version = "v1alpha4"
dockerfile = "Dockerfile"
published_image = "docker.io/projectjackin/jackin-the-architect:latest"
agents = ["claude", "codex", "amp", "opencode", "kimi", "grok"]

[identity]
name = "The Architect"

[claude]
model = "claude-sonnet-4-6"
plugins = [
  "code-review@claude-plugins-official",
  "code-simplifier@claude-plugins-official",
  "feature-dev@claude-plugins-official",
  "commit-commands@claude-plugins-official",
  "github@claude-plugins-official",
  "claude-md-management@claude-plugins-official",
  "security-guidance@claude-plugins-official",
  "pr-review-toolkit@claude-plugins-official",
  "rust-analyzer-lsp@claude-plugins-official",
  "jackin-dev@jackin-marketplace",
  "rust-best-practices@tailrocks-marketplace",
  "caveman@caveman",
]

[[claude.marketplaces]]
source = "jackin-project/jackin-marketplace"

[[claude.marketplaces]]
source = "tailrocks/tailrocks-marketplace"

[[claude.marketplaces]]
source = "JuliusBrussee/caveman"

[codex]

[amp]

[opencode]
model = "zai-coding-plan/glm-5.2"

[kimi]

[grok]
model = "grok-build"

[hooks]
preflight = "hooks/preflight.sh"

[env.CLAUDE_CODE_NO_FLICKER]
default = "1"

[env.CLAUDE_CODE_MAX_OUTPUT_TOKENS]
default = "64000"

# Non-interactive CONTEXT7 (default empty, set via host env).
[env.CONTEXT7_API_KEY]
default = ""

[env.CAVEMAN_DEFAULT_MODE]
default = "ultra"

# ── Third-party provider selection ───────────────────────────────────
# The preflight script writes ~/.claude/settings.json and ~/.codex/config.toml
# based on these selections, routing Claude Code / Codex through the chosen
# provider's Anthropic- or OpenAI-compatible endpoint.
#
# Claude Code providers:
#   anthropic — default, no override
#   zai       — GLM-5.2 (1M ctx), https://docs.z.ai/devpack/tool/claude
#   minimax   — MiniMax-M3 (1M ctx), https://platform.minimax.io/docs/token-plan/claude-code
#   kimi      — K2.7/K2.6 server-side mapping, https://www.kimi.com/code/docs/en/third-party-tools/other-coding-agents.html
#
# Codex providers:
#   openai    — default, no override
#   minimax   — MiniMax-M3, https://platform.minimax.io/docs/token-plan/codex
#   zai       — GLM-5.2 via OpenAI-compatible endpoint, https://docs.z.ai/devpack/tool/others

[env.CLAUDE_CODE_PROVIDER]
interactive = true
options = ["anthropic", "zai", "minimax", "kimi"]
prompt = "Claude Code LLM provider:"
default = "anthropic"

[env.CODEX_PROVIDER]
interactive = true
options = ["openai", "minimax", "zai"]
prompt = "Codex LLM provider:"
default = "openai"

[env.ZAI_API_KEY]
interactive = true
skippable = true
prompt = "Z.AI API key (https://z.ai/manage-apikey/apikey-list)"

[env.MINIMAX_API_KEY]
interactive = true
skippable = true
prompt = "MiniMax API key (https://platform.minimax.io/user-center/payment/token-plan)"

[env.KIMI_API_KEY]
interactive = true
skippable = true
prompt = "Kimi Code API key (https://www.kimi.com/code/console)"
