version = "v1alpha4"
dockerfile = "Dockerfile"
published_image = "docker.io/projectjackin/jackin-the-architect:latest"
agents = ["claude", "codex", "amp", "opencode", "kimi", "grok"]

[identity]
name = "The Architect"

[claude]
model = "claude-sonnet-4-6"
plugins = [
  "code-review@claude-plugins-official",
  "code-simplifier@claude-plugins-official",
  "feature-dev@claude-plugins-official",
  "commit-commands@claude-plugins-official",
  "github@claude-plugins-official",
  "claude-md-management@claude-plugins-official",
  "security-guidance@claude-plugins-official",
  "pr-review-toolkit@claude-plugins-official",
  "rust-analyzer-lsp@claude-plugins-official",
  "jackin-dev@jackin-marketplace",
  "rust-best-practices@tailrocks-marketplace",
  "caveman@caveman",
]

[[claude.marketplaces]]
source = "jackin-project/jackin-marketplace"

[[claude.marketplaces]]
source = "tailrocks/tailrocks-marketplace"

[[claude.marketplaces]]
source = "JuliusBrussee/caveman"

[codex]

[amp]

[opencode]
model = "zai-coding-plan/glm-5.1"

[kimi]

[grok]
model = "grok-build"

[hooks]
preflight = "hooks/preflight.sh"

[env.CLAUDE_CODE_NO_FLICKER]
default = "1"

[env.CLAUDE_CODE_MAX_OUTPUT_TOKENS]
default = "64000"

# Context7 API key. Declared as a non-interactive shape so jackin never
# prompts at launch. Default is empty; operator env overlays a real
# value when the operator has set one. Wire it up once with a host
# reference and every launch reads it automatically:
#
#   jackin config env set CONTEXT7_API_KEY '${CONTEXT7_API_KEY}'
#
# then export CONTEXT7_API_KEY=ctx7sk-... in the host shell. When the
# key is absent the preflight hook skips Context7 setup entirely
# (no OAuth device flow).
[env.CONTEXT7_API_KEY]
default = ""
